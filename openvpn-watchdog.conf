# /etc/openvpn-watchdog.conf
#
# Configuration for openvpn-watchdog.
# This package watches OpenVPN profiles and restarts only OpenVPN services.
# It does NOT reboot the computer.  Reboot watchdog logic should live in a
# separate package/service.

# -----------------------------------------------------------------------------
# Profiles
# -----------------------------------------------------------------------------
# Simple logic:
#   type=SERVER -> check only the systemd service.
#   type=CLIENT -> check the systemd service and, if ping= is configured,
#                  also check VPN-side availability by ping.
#
# name= is the OpenVPN profile name used to build the service name:
#   SERVER -> openvpn-server@<name>-server.service
#   CLIENT -> openvpn-client@<name>-client.service
#
# If your service name is different, add service= explicitly.
# Example:
#   "name=office type=CLIENT service=openvpn-client@office.service ping=10.8.0.1 restart_cycles=3"
#
# ping= may contain one or more comma-separated targets.  For CLIENT profiles,
# at least one target must answer.  SERVER profiles do not need ping=.
#
# restart_cycles= means how many failed CLIENT ping cycles are allowed before
# restarting that client service.  Service-down events restart immediately.

OPENVPN_PROFILES=(
    "name=office type=CLIENT ping=10.8.0.1 restart_cycles=3"
    "name=branch type=CLIENT ping=10.9.0.1,10.9.0.2 restart_cycles=3"
    "name=main type=SERVER restart_cycles=3"
)

# -----------------------------------------------------------------------------
# Logs and state
# -----------------------------------------------------------------------------
LOG_DIR="/var/log/openvpn-watchdog"
STATE_DIR="/var/lib/openvpn-watchdog"
LOG_RETENTION_DAYS=30

# -----------------------------------------------------------------------------
# Ping settings
# -----------------------------------------------------------------------------
PING_COUNT=3
PING_TIMEOUT=3
DEFAULT_RESTART_CYCLES=3

# Minimal protection from restart loops.  Set 0 to disable cooldown.
RESTART_COOLDOWN_SECONDS=60

# Optional global Internet check.  It is useful for CLIENT profiles: if the
# whole host has no Internet, the script can avoid uselessly restarting every
# OpenVPN client because VPN ping targets are unreachable.
INTERNET_CHECK_ENABLED="YES"
PING_SERVER_INT="8.8.8.8,1.1.1.1"
SKIP_CLIENT_PING_WHEN_INTERNET_DOWN="YES"

# -----------------------------------------------------------------------------
# Future notifications
# -----------------------------------------------------------------------------
# The main script already supports a notification hook.  Later this hook can be
# implemented as Email, Matrix, Telegram, Zabbix sender, etc.
#
# The hook receives these environment variables:
#   OPENVPN_WATCHDOG_TIME
#   OPENVPN_WATCHDOG_SEVERITY
#   OPENVPN_WATCHDOG_PROFILE
#   OPENVPN_WATCHDOG_TYPE
#   OPENVPN_WATCHDOG_SERVICE
#   OPENVPN_WATCHDOG_EVENT
#   OPENVPN_WATCHDOG_MESSAGE
#   OPENVPN_WATCHDOG_LOG_FILE
#   OPENVPN_WATCHDOG_EVENT_LOG

NOTIFICATIONS_ENABLED="NO"
NOTIFY_SCRIPT=""
# Example for later:
# NOTIFICATIONS_ENABLED="YES"
# NOTIFY_SCRIPT="/usr/local/bin/openvpn-watchdog-notify.sh"

# -----------------------------------------------------------------------------
# Future log analysis
# -----------------------------------------------------------------------------
# Current behavior: when a service or VPN ping problem is detected, the script
# checks recent journalctl lines for common OpenVPN error patterns and writes a
# structured event.  It does not make restart decisions from logs yet.

LOG_ANALYSIS_ENABLED="YES"
LOG_ANALYSIS_ON_PROBLEM_ONLY="YES"
LOG_ANALYSIS_LINES=120
LOG_ANALYSIS_MAX_MATCHES=5
LOG_ANALYSIS_PATTERNS="AUTH_FAILED|TLS Error|Inactivity timeout|Connection reset|Cannot resolve host address|VERIFY ERROR|Options error|Exiting due to fatal error"
